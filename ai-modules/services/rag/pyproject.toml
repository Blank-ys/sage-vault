[project]
name = "sage-vault-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.139,<0.140",
  "nacos-sdk-python>=3.2,<4",
  "pydantic-settings>=2.14,<3",
  "uvicorn>=0.51,<0.52",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.26,<5",
  "mypy==2.3.0",
  "pytest>=9.1,<10",
  "ruff==0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/sage_vault_rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
