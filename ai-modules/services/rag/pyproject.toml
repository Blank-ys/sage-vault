[project]
name = "sage-vault-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "charset-normalizer>=3.4,<4",
  "fastapi>=0.139,<0.140",
  "flagembedding==1.4.0",
  "httpx>=0.28,<0.29",
  "langchain>=1.3.14,<2",
  "nacos-sdk-python>=3.2,<4",
  "pydantic-settings>=2.14,<3",
  "pymilvus>=2.4.10,<2.5",
  "pypdf>=6.14,<7",
  "setuptools>=60,<71",
  "uvicorn>=0.51,<0.52",
]

[dependency-groups]
dev = [
  "jsonschema>=4.26,<5",
  "mypy==2.3.0",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff==0.16.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "pymilvus.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "FlagEmbedding.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/sage_vault_rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
