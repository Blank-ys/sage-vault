mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SAGE_VAULT_DB_URL}
    username: ${SAGE_VAULT_DB_USERNAME}
    password: ${SAGE_VAULT_DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

sage-vault:
  rag:
    service-id: sage-vault-rag
    signing-key: ${SAGE_VAULT_RAG_SIGNING_KEY}
  minio:
    endpoint: ${SAGE_VAULT_MINIO_ENDPOINT}
    access-key: ${SAGE_VAULT_MINIO_ACCESS_KEY}
    secret-key: ${SAGE_VAULT_MINIO_SECRET_KEY}
    bucket: ${SAGE_VAULT_MINIO_BUCKET:sage-vault-documents}
