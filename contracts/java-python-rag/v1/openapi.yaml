openapi: 3.1.0
info:
  title: Sage Vault Java-Python RAG Contract
  version: 1.0.0
paths:
  /internal/v1/answers:
    post:
      operationId: answer
      parameters:
        - {name: X-Sage-Timestamp, in: header, required: true, schema: {type: string}}
        - {name: X-Sage-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: Project-owned SSE events
          content:
            text/event-stream:
              schema: {type: string}
        '401': {description: Invalid deployment signature}
  /internal/v1/answers/{generationId}/cancel:
    post:
      operationId: cancelAnswer
      description: >-
        Best-effort cancellation of an in-flight generation. Java owns the
        business decision; Python only stops producing further deltas and ends
        the stream with a stopped event. The call must be routed back to the
        instance that owns the generation.
      parameters:
        - {name: generationId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-Sage-Timestamp, in: header, required: true, schema: {type: string}}
        - {name: X-Sage-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAnswerCommand'
      responses:
        '202':
          description: Cancellation accepted; the owning stream will end with a stopped event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAnswerAck'
        '401': {description: Invalid deployment signature}
  /internal/v1/indexing:
    post:
      operationId: indexDocument
      parameters:
        - {name: X-Sage-Timestamp, in: header, required: true, schema: {type: string}}
        - {name: X-Sage-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexingCommand'
      responses:
        '202':
          description: Command accepted; processing happens asynchronously
        '401': {description: Invalid deployment signature}
  /internal/v1/indexing/callbacks:
    post:
      operationId: indexingCallback
      parameters:
        - {name: X-Sage-Timestamp, in: header, required: true, schema: {type: string}}
        - {name: X-Sage-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexingCallback'
      responses:
        '200':
          description: Callback accepted and idempotently reconciled
        '401': {description: Invalid deployment signature}
  /internal/v1/cleanup:
    post:
      operationId: cleanupDocument
      parameters:
        - {name: X-Sage-Timestamp, in: header, required: true, schema: {type: string}}
        - {name: X-Sage-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupCommand'
      responses:
        '202':
          description: Command accepted; processing happens asynchronously
        '401': {description: Invalid deployment signature}
  /internal/v1/cleanup/callbacks:
    post:
      operationId: cleanupCallback
      parameters:
        - {name: X-Sage-Timestamp, in: header, required: true, schema: {type: string}}
        - {name: X-Sage-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupCallback'
      responses:
        '200':
          description: Callback accepted and idempotently reconciled
        '401': {description: Invalid deployment signature}
components:
  schemas:
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [knowledgeBaseId, question, requestId, generationId]
      properties:
        knowledgeBaseId: {type: integer, format: int64, minimum: 1}
        question: {type: string, minLength: 1}
        requestId: {type: string, minLength: 1}
        generationId: {type: string, format: uuid}
    CancelAnswerCommand:
      type: object
      additionalProperties: false
      required: [generationId, requestId]
      properties:
        generationId: {type: string, format: uuid}
        requestId: {type: string, minLength: 1}
    CancelAnswerAck:
      type: object
      additionalProperties: false
      required: [generationId, cancelled]
      properties:
        generationId: {type: string, format: uuid}
        cancelled:
          type: boolean
          description: >-
            True when this instance owned the generation and signalled it to
            stop. False means the generation is unknown here; Java still owns
            the terminal decision and must not treat it as a failure.
    IndexingCommand:
      type: object
      additionalProperties: false
      required: [taskId, attempt, knowledgeBaseId, documentId, filename, sourceUrl, requestId]
      properties:
        taskId: {type: string, minLength: 1}
        attempt: {type: integer, minimum: 1}
        knowledgeBaseId: {type: integer, format: int64, minimum: 1}
        documentId: {type: string, minLength: 1}
        filename: {type: string, minLength: 1}
        sourceUrl: {type: string, format: uri, minLength: 1}
        requestId: {type: string, minLength: 1}
    IndexingCallback:
      type: object
      additionalProperties: false
      required: [taskId, attempt, documentId, success, chunksCount, requestId]
      properties:
        taskId: {type: string, minLength: 1}
        attempt: {type: integer, minimum: 1}
        documentId: {type: string, minLength: 1}
        success: {type: boolean}
        chunksCount: {type: integer, minimum: 0}
        requestId: {type: string, minLength: 1}
        diagnostics:
          type: object
          additionalProperties: true
    CleanupCommand:
      type: object
      additionalProperties: false
      required: [taskId, knowledgeBaseId, documentId, requestId]
      properties:
        taskId: {type: string, minLength: 1}
        knowledgeBaseId: {type: integer, format: int64, minimum: 1}
        documentId: {type: string, minLength: 1}
        requestId: {type: string, minLength: 1}
    CleanupCallback:
      type: object
      additionalProperties: false
      required: [taskId, documentId, success, requestId]
      properties:
        taskId: {type: string, minLength: 1}
        documentId: {type: string, minLength: 1}
        success: {type: boolean}
        requestId: {type: string, minLength: 1}
        diagnostics:
          type: object
          additionalProperties: true
